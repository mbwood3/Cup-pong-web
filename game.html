<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cup Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #1a1a2e; touch-action: none; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; }
    #reset {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      padding: 15px 30px; font-size: 20px; background: white; border: none;
      border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="reset">Reset Ball</button>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script>
(function () {
  'use strict';

  // Cup rack colors - bright and bold
  var RACK_COLORS = [
    0xff3366,  // Hot pink / red
    0x33ccff,  // Cyan / bright blue  
    0x66ff66   // Lime green
  ];

  var DISTANCE = 2.0, SPACING = 0.52, ROW_OFFSET = SPACING * Math.sqrt(3) / 2;

  var canvas = document.getElementById('game');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 8, 12);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(5, 10, 5);
  scene.add(sun);

  // Physics
  var world = new CANNON.World();
  world.gravity.set(0, -9.8, 0);
  world.broadphase = new CANNON.NaiveBroadphase();
  world.solver.iterations = 20;

  // Floor
  var floorMesh = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    new THREE.MeshStandardMaterial({ color: 0x2d2d44 })
  );
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.y = -0.1;
  scene.add(floorMesh);

  var floorBody = new CANNON.Body({ mass: 0 });
  floorBody.addShape(new CANNON.Plane());
  floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  floorBody.position.set(0, -0.1, 0);
  world.addBody(floorBody);

  // Ball
  var ballMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x333333 })
  );
  scene.add(ballMesh);

  var ballBody = new CANNON.Body({ mass: 0.05 });
  ballBody.addShape(new CANNON.Sphere(0.15));
  ballBody.position.set(0, 2, 5);
  ballBody.linearDamping = 0.1;
  world.addBody(ballBody);

  // Cups - store meshes and bodies
  var cups = [];

  function createCup(x, z, angle, color) {
    // Create a unique material for each cup
    var material = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 0.3,
      metalness: 0.1,
      roughness: 0.8
    });

    var mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.15, 0.6, 32),
      material
    );
    mesh.position.set(x, 0.2, z);
    mesh.rotation.y = -angle;
    scene.add(mesh);

    var body = new CANNON.Body({ mass: 0 });
    body.addShape(new CANNON.Cylinder(0.25, 0.15, 0.6, 16));
    body.position.set(x, 0.2, z);
    body.quaternion.setFromEuler(0, -angle, 0);
    world.addBody(body);

    cups.push({ mesh: mesh, body: body });
  }

  // Create 3 racks of cups
  for (var r = 0; r < 3; r++) {
    var angle = r * (2 * Math.PI / 3);
    var color = RACK_COLORS[r];

    for (var row = 0; row < 4; row++) {
      for (var col = 0; col <= row; col++) {
        var lx = (col - row / 2) * SPACING;
        var lz = row * ROW_OFFSET;
        var wx = lx * Math.cos(angle) - (lz + DISTANCE) * Math.sin(angle);
        var wz = lx * Math.sin(angle) + (lz + DISTANCE) * Math.cos(angle);
        createCup(wx, wz, angle, color);
      }
    }
  }

  function resetBall() {
    ballBody.position.set(0, 2, 5);
    ballBody.velocity.set(0, 0, 0);
    ballBody.angularVelocity.set(0, 0, 0);
  }

  // Input handling
  var startX = 0, startY = 0, startTime = 0;

  function onStart(x, y) {
    startX = x; startY = y; startTime = Date.now();
  }

  function onEnd(x, y) {
    var dt = Date.now() - startTime;
    if (dt < 50) return;
    var f = 4;
    ballBody.velocity.set(
      ((x - startX) / dt) * f,
      (Math.abs(y - startY) / dt) * f * 0.5,
      -(Math.abs(y - startY) / dt) * f
    );
  }

  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); });
  canvas.addEventListener('touchend', function(e) { e.preventDefault(); onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });
  canvas.addEventListener('mousedown', function(e) { e.preventDefault(); onStart(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup', function(e) { e.preventDefault(); onEnd(e.clientX, e.clientY); });

  document.getElementById('reset').addEventListener('click', resetBall);

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animation loop
  var last = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    world.step(dt);

    ballMesh.position.copy(ballBody.position);
    ballMesh.quaternion.copy(ballBody.quaternion);

    for (var i = 0; i < cups.length; i++) {
      cups[i].mesh.position.copy(cups[i].body.position);
      cups[i].mesh.quaternion.copy(cups[i].body.quaternion);
    }

    renderer.render(scene, camera);
  }
  animate(performance.now());
})();
  </script>
</body>
</html>
